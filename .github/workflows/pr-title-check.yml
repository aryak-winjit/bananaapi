name: Validate PR Title and Description

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title or Description for Work Item ID
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            
            // Combines title and description into one text block to search
            const combinedText = `${title}\n${body}`;
            
            // Supports Azure DevOps (AB#1234) and Jira (PROJ-1234 or PROJ_1234)
            const regex = /(AB#\d+|[A-Z]{1,10}[-_]\d+)/i;
            
            if (!regex.test(combinedText)) {
              console.error(`Validation Failed: Neither the PR title nor description contains a valid Jira or Azure DevOps ID.`);
              setFailed("PR title or description must include a work item ID (e.g., 'AB#1234' or 'PROJ-567').");
            } else {
              console.log("PR validation passed! Work item ID found.");
            }
