on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
name: Validate PR Title and Description
jobs:
  check-pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title or Description for Work Item ID
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";
            
            // Combines title and description into one text block to search
            const combinedText = `${title}\n${body}`;

            // Reject smashed IDs like AB#1323AB#456 — Azure Boards won't link them
            if (/AB#\d+AB#/i.test(combinedText)) {
              core.setFailed(
                "Work item IDs must be separated (e.g., 'AB#1323 AB#456'), not joined like 'AB#1323AB#456'."
              );
              return;
            }

            // Requires at least one Azure DevOps work item ID (AB#1234)
            if (!/AB#\d+/i.test(combinedText)) {
              core.setFailed("PR title or description must include a work item ID (e.g., 'AB#1234').");
            } else {
              console.log("PR validation passed! Work item ID found.");
            }
